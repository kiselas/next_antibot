# Alembic config for CLI use (e.g. `DB_PATH=./data/bot.db alembic upgrade head`).
# At runtime the bot applies migrations programmatically via antispam_bot.db.run_migrations,
# which sets script_location and the SQLite URL itself.
[alembic]
script_location = antispam_bot/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
