services:
  antispam-bot:
    build: .
    container_name: antispam-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # Long polling — порты пробрасывать не нужно.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,time,sys;
          p='/app/data/heartbeat';
          sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
