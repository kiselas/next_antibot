[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antispam-bot"
version = "0.2.0"
description = "Self-hosted Telegram antispam bot with pluggable LLM classifiers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Aleksandr" }]
keywords = ["telegram", "bot", "antispam", "moderation", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
]
dependencies = [
    "python-telegram-bot[rate-limiter,job-queue]>=22.0,<23",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
antispam-bot = "antispam_bot.main:main"

[project.urls]
Homepage = "https://github.com/your-org/antispam-bot"
Issues = "https://github.com/your-org/antispam-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["antispam_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["antispam_bot"]
omit = ["antispam_bot/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disallow_untyped_defs = false

# PTB's Update.* attributes are Optional; the adapter guards them but mypy can't
# always follow the narrowing across property accesses. Suppress that friction.
[[tool.mypy.overrides]]
module = "antispam_bot.telegram_adapter"
disable_error_code = ["union-attr"]
